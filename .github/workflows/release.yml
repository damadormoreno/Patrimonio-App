name: Release

# Builds the signed Android App Bundle (AAB) for Google Play on a version tag (v1.0.0, v1.0.0-beta.1) or on demand.
# The AAB is only stored as a workflow artifact: the first upload to Play Console is manual, and a later
# automatic upload needs a Play service account (see docs/release.md). Setup, secrets and versioning: docs/release.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName for the build, without the v (e.g. 1.0.0-beta.1)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android · signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      # A release is deliberate, so unlike the preview build a missing secret fails the run.
      - name: Check secrets
        run: |
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/release.md)"
            exit 1
          fi

      # Tag names and dispatch inputs are user input: they reach the script only through env vars.
      - name: Version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="${INPUT_VERSION_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a valid version (expected 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          # Play needs a versionCode that grows with every upload; the run number of this workflow does.
          echo "VERSION_CODE=$RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building $version (versionCode $RUN_NUMBER)"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM + Robolectric/Room)
        run: ./gradlew :composeApp:testDebugUnitTest

      # The upload keystore lives only in the runner's temp folder, never in the repository.
      - name: Upload keystore
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Fingerprints are public. Play Console shows the upload certificate it expects; Firebase needs the
      # App signing certificate (Play Console → App integrity), not this one.
      - name: Upload certificate fingerprints
        run: |
          {
            echo "### Upload certificate · $VERSION_NAME (versionCode $VERSION_CODE)"
            keytool -list -v -keystore "$RELEASE_KEYSTORE_FILE" -alias "$RELEASE_KEY_ALIAS" \
              -storepass "$RELEASE_KEYSTORE_PASSWORD" | grep -E '^\s*SHA(1|256):' | sed -E 's/^\s*/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle release (AAB)
        run: ./gradlew :composeApp:bundleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: patrimonio-${{ env.VERSION_NAME }}-aab
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab
          if-no-files-found: error
          retention-days: 90

      # The AAB already carries this mapping for Play's crash reports; keep the file for stack traces from
      # other sources.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ env.VERSION_NAME }}
          path: composeApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      # Later, once a Play service account exists (Play Console → API access), add a step here with
      # r0adkll/upload-google-play (track: internal) and the AAB above, so tags publish without a manual upload.
