name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android · lint, tests, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew :composeApp:ktlintCheck

      - name: Unit tests (JVM + Robolectric/Room)
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug

      # Room exports the schema on every build; a diff means the committed JSON is stale or
      # missing, and migrations would be written against the wrong baseline.
      - name: Room schema is committed
        run: |
          git add -N composeApp/schemas
          git diff --exit-code -- composeApp/schemas || {
            echo "::error::Room schema changed. Commit composeApp/schemas/ from a local build."
            exit 1
          }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

  ios:
    name: iOS · Kotlin/Native compile
    # macOS minutes bill at 10x on private repos; the triggers above already limit runs to PRs
    # and pushes to main.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Compile iosArm64
        run: ./gradlew :composeApp:compileKotlinIosArm64
