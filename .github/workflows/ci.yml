name: CI

# Actions minutes are scarce (private repo): only PRs that change code, and on demand. A merge to main is
# not re-checked; it is what the PR already ran. Before pushing, run scripts/check.sh locally.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android · lint, tests, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew :composeApp:ktlintCheck

      - name: Unit tests (JVM + Robolectric/Room)
        run: ./gradlew :composeApp:testDebugUnitTest

      # The preview build is minified like the store build (R8), signed here with the debug key. R8 fails
      # the build on classes referenced but missing; it then writes the rules it suggests.
      - name: Assemble minified preview APK (R8)
        run: ./gradlew :composeApp:assemblePreview

      - name: R8 suggested rules
        if: failure()
        run: |
          rules=composeApp/build/outputs/mapping/preview/missing_rules.txt
          if [ -f "$rules" ]; then
            # One annotation, so the rules can be read from the check run without the log.
            echo "::error title=R8 missing rules::$(sed ':a;N;$!ba;s/\n/%0A/g' "$rules")"
          fi

      - name: Upload R8 mapping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-preview
          path: composeApp/build/outputs/mapping/preview/mapping.txt
          if-no-files-found: error
          retention-days: 30

      # Room exports the schema on every build; a diff means the committed JSON is stale or
      # missing, and migrations would be written against the wrong baseline.
      - name: Room schema is committed
        run: |
          git add -N composeApp/schemas
          git diff --exit-code -- composeApp/schemas || {
            echo "::error::Room schema changed. Commit composeApp/schemas/ from a local build."
            exit 1
          }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

  ios:
    name: iOS · Kotlin/Native compile
    # macOS minutes bill at 10x on private repos (~30 min per run): only on demand (Actions → CI → Run
    # workflow on the branch). scripts/check.sh compiles iOS locally on a Mac.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Compile iosArm64
        run: ./gradlew :composeApp:compileKotlinIosArm64
